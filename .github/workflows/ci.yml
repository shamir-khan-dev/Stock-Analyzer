name: CI / Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Quantitative Suite & Strategy Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest Suite (15 Tests)
        env:
          PYTHONPATH: backend
        run: |
          pytest tests/ -v

      - name: Run Performance & Backtester Benchmarks Verification
        env:
          PYTHONPATH: backend
        run: |
          python benchmarks/run_backtest_benchmark.py
